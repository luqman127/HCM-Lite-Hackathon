{% extends 'base.html' %}{% block content %}<h1>My profile</h1><section class="panel"><p><b>{{ e.name }}</b> · {{ e.code }}</p><p>{{ e.email }} · {{ e.designation or 'No designation' }}</p><form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><label>Phone<input name="phone" value="{{ e.phone }}"></label><label>Address<textarea name="address">{{ e.address }}</textarea></label><button>Save profile</button></form><p class="muted">Only phone and address can be edited here. Salary, role and attendance are managed separately.</p></section>{% endblock %}
