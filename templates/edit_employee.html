{% extends 'base.html' %}{% block content %}<h1>Edit employee</h1><section class="panel"><form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><label>Employee code<input name="code" value="{{ e.code }}" required></label><label>Full name<input name="name" value="{{ e.name }}" required></label><label>Email<input type="email" name="email" value="{{ e.email }}" required></label><label>Phone<input name="phone" value="{{ e.phone }}"></label><label>Address<textarea name="address">{{ e.address }}</textarea></label><label>Department<select name="department_id"><option value="">Unassigned</option>{% for d in depts %}<option value="{{ d.id }}" {% if e.department_id==d.id %}selected{% endif %}>{{ d.name }}</option>{% endfor %}</select></label><label>Designation<input name="designation" value="{{ e.designation }}"></label><label>Join date<input type="date" name="join_date" value="{{ e.join_date }}" required></label><label>Basic monthly salary<input type="number" name="basic" min="0.01" step="0.01" value="{{ e.basic }}" required></label><button>Save changes</button></form></section>{% endblock %}
