{% extends 'base.html' %}{% block content %}<h1>AI Assistant</h1><section class="panel narrow"><p>Ask about attendance, leave balances, headcount, payroll or company rules. The answer uses server-verified data and your role scope.</p><form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><label>Your question<textarea name="question" rows="4" required>{{ question }}</textarea></label><button>Ask assistant</button></form>{% if answer %}<div class="answer"><h2>Answer</h2><p>{{ answer }}</p></div>{% endif %}</section>{% endblock %}
