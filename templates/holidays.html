{% extends 'base.html' %}{% block content %}<h1>Public holidays</h1><div class="grid"><section class="panel"><h2>Add holiday</h2><form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><label>Date<input type="date" name="day" required></label><label>Name<input name="name" required></label><button>Add holiday</button></form></section><section class="panel"><h2>Configured holidays</h2><table><tr><th>Date</th><th>Name</th></tr>{% for h in rows %}<tr><td>{{ h.day }}</td><td>{{ h.name }}</td></tr>{% endfor %}</table></section></div>{% endblock %}
