{% extends 'base.html' %}{% block content %}<h1>Audit log</h1><section class="panel"><table><tr><th>When</th><th>Actor</th><th>Action</th><th>Entity</th><th>ID</th><th>Before</th><th>After</th></tr>{% for r in rows %}<tr><td>{{ r.created }}</td><td>{{ r.email or 'system' }}</td><td>{{ r.action }}</td><td>{{ r.entity }}</td><td>{{ r.entity_id or '-' }}</td><td>{{ r.before_json or '-' }}</td><td>{{ r.after_json or '-' }}</td></tr>{% endfor %}</table></section>{% endblock %}
