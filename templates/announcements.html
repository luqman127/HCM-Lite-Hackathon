{% extends 'base.html' %}{% block content %}<h1>Announcements</h1>{% if me.role in ['Admin','HR'] %}<section class="panel"><h2>Post announcement</h2><form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><label>Title<input name="title" required></label><label>Message<textarea name="body" required></textarea></label><button>Publish</button></form></section>{% endif %}{% for a in rows %}<article class="panel"><h2>{{ a.title }}</h2><p>{{ a.body }}</p><small>{{ a.email }} · {{ a.created }}</small></article>{% else %}<p>No announcements yet.</p>{% endfor %}{% endblock %}
