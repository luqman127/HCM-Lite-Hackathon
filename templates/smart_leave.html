{% extends 'base.html' %}{% block content %}<h1>Smart leave assistant</h1><section class="panel"><form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><label>Describe your leave request in plain English or Roman Urdu<textarea name="sentence" rows="3" required>{{ sentence or '' }}</textarea></label><button>Parse request</button></form></section>{% if parsed %}<section class="panel"><h2>Review the suggested form</h2><p>Please verify the dates and type. Nothing is saved until you submit.</p><form method="post" action="{{ url_for('leave') }}"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><label>Leave type<select name="type">{% for t in types %}<option {% if t.name==parsed.type %}selected{% endif %}>{{ t.name }}</option>{% endfor %}</select></label><label>Start date<input type="date" name="start" value="{{ parsed.start }}" required></label><label>End date<input type="date" name="end" value="{{ parsed.end }}" required></label><label>Reason<textarea name="reason" required>{{ parsed.reason }}</textarea></label><button>Confirm and submit leave request</button></form></section>{% endif %}{% endblock %}
